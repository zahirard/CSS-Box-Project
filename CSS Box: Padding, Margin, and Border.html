<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Box: Padding, Margin, and Border</title>

  <style>
    .box200 {
      width: 250px;
      height: 200px;
      color: rgb(17, 183, 238);
      padding: 40px 15px 0px 15px;
      margin: 25px 10px;
      border-width: 5px 5px;
      border-style:dotted dotted;
      border-color: red rgb(229, 13, 13) rgb(236, 13, 13) rgb(227, 13, 13);
    }
  </style>
</head>

<body>

  <p>This is before the box.</p>

  <div class="box200">
    This is a 200 x 200 pixel box with a border.
  </div>

  <p>This is after the box.</p>

</body>
</html>
